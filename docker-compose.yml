services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jarvis-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: jarvis-pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres

  seaweedfs:
    # Replaces MinIO, which archived its OSS project and closed every
    # distribution channel (prds/minio-eol-object-store.md). Pinned by DIGEST
    # rather than a tag -- the 2026-09-11 breakage was an unpinned :latest
    # changing behaviour under us, and a digest cannot move at all.
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: jarvis-seaweedfs
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY}
    # `-s3.config` takes a file path, not env vars, so the identity file is
    # written from the generated secrets before exec. `$$` = shell, not compose.
    #
    # -volume.max is NOT optional: it defaults to 8, SeaweedFS makes a volume
    # collection per bucket and grows them 7 at a time, so a single node runs
    # out of slots and every PutObject returns InternalError. `0` auto-sizes
    # from free disk and resolved to 2 in a container. Verified 2026-10-01.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<CFG
        {"identities":[{"name":"jarvis","credentials":[{"accessKey":"$$OBJECT_STORE_ACCESS_KEY","secretKey":"$$OBJECT_STORE_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        CFG
        exec weed server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -volume.max=64 -master.volumeSizeLimitMB=1024
    ports:
      - "${SEAWEEDFS_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data
    networks:
      - default

  minio:
    # quay.io, pinned: MinIO deleted its Docker Hub repositories, and the
    # nightly quickstart lane has failed on "pull access denied for
    # minio/minio" ever since. A release tag rather than :latest because the
    # day BEFORE they disappeared a new :latest broke the bucket one-shot --
    # the same outage twice, from following a tag we do not control.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: jarvis-minio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    ports:
      - "${MINIO_PORT}:${MINIO_PORT}"
      - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7
    container_name: jarvis-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --port ${REDIS_PORT}
    env_file:
      - .env
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: jarvis-redis-commander
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOSTS: local:redis:${REDIS_PORT}:0:${REDIS_PASSWORD}
    ports:
      - "${REDIS_COMMANDER_PORT}:8081"
    depends_on:
      - redis
    profiles:
      - tools

  go2rtc:
    image: alexxit/go2rtc
    container_name: jarvis-go2rtc
    restart: unless-stopped
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
    # Publish the WebRTC media port so STUN-discovered candidates are reachable
    # (required for WebRTC-only sources like the nest: battery doorbell).
    ports:
      - "8555:8555/tcp"
      - "8555:8555/udp"
    networks:
      - default
      - jarvis-net

  # MQTT broker. CLAUDE.md lists Mosquitto as shared infra and ./jarvis registers
  # jarvis-mqtt-broker at mqtt://<host>:1884, but nothing here actually ran one —
  # so every MQTT path silently timed out (the app spins on "Loading tools…"
  # because GET /nodes/{id}/tools asks the node over MQTT with a 10s timeout).
  #
  # Mirrors jarvis-installer/src/lib/compose-export-generator.ts so a source dev
  # stack and an installer stack behave the same, including its two documented
  # gotchas: `rm -f` because mosquitto_passwd -c refuses an existing file on
  # restart, and `chown` because mosquitto drops privileges before reading the
  # password file and crash-loops on a root-owned 0600 pwfile.
  #
  # allow_anonymous stays false (the installer's default) — command-center reads
  # MQTT_PASSWORD from its env and nodes fetch the shared credential over
  # authenticated HTTP (/api/v0/node/mqtt-credentials) before connecting, so
  # there is no anonymous client to strand.
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: jarvis-mosquitto
    restart: unless-stopped
    environment:
      MQTT_USERNAME: "${MQTT_USERNAME:-jarvis}"
      MQTT_PASSWORD: "${MQTT_PASSWORD}"
      MQTT_ALLOW_ANON: "${MQTT_ALLOW_ANON:-false}"
    command:
      - sh
      - -c
      - |
        rm -f /tmp/pwfile
        mosquitto_passwd -b -c /tmp/pwfile "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
        chown mosquitto:mosquitto /tmp/pwfile
        echo 'listener 1883' > /tmp/mosquitto.conf
        echo 'protocol mqtt' >> /tmp/mosquitto.conf
        echo 'listener 9001' >> /tmp/mosquitto.conf
        echo 'protocol websockets' >> /tmp/mosquitto.conf
        echo "allow_anonymous $$MQTT_ALLOW_ANON" >> /tmp/mosquitto.conf
        echo 'password_file /tmp/pwfile' >> /tmp/mosquitto.conf
        exec mosquitto -c /tmp/mosquitto.conf -v
    ports:
      - "${MQTT_PORT:-1884}:1883"
      - "${MQTT_WS_PORT:-9883}:9001"
    volumes:
      - mosquitto_data:/mosquitto/data

networks:
  jarvis-net:
    external: true

volumes:
  seaweedfs_data:
  postgres_data:
  minio_data:
  redis_data:
  mosquitto_data:
