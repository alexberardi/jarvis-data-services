services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jarvis-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: jarvis-pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres

  # S3-compatible object store. Was MinIO until 2026-10-01, when MinIO archived
  # its OSS project and closed every distribution channel -- the old
  # `minio/minio:latest` here pointed at a DELETED Docker Hub repo, so a fresh
  # `./jarvis quickstart` could not pull it at all. See
  # prds/minio-eol-object-store.md.
  #
  # Pinned by DIGEST rather than a tag: the 2026-09-11 breakage was an unpinned
  # :latest changing behaviour under us, and a digest cannot move.
  seaweedfs:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: jarvis-seaweedfs
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY}
    # `-s3.config` takes a FILE PATH, not env vars, so the identity file is
    # written from the generated secrets before exec. `$$` is compose's escape:
    # the SHELL expands these, not compose. A literal block, not a folded
    # scalar -- folding joins the lines with spaces and breaks the script.
    #
    # -volume.max is NOT optional. It defaults to 8, SeaweedFS makes a volume
    # collection PER BUCKET and grows them 7 at a time, so a single-node install
    # runs out of slots and every PutObject returns InternalError ("No writable
    # volumes ... Not enough data nodes found!"). `-volume.max=0` is worse than
    # it reads: it auto-sizes from free disk / volume size and resolved to 2
    # inside a container. Verified 2026-10-01 -- 8 of 9 objects failed until set.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<CFG
        {"identities":[{"name":"jarvis","credentials":[{"accessKey":"$$OBJECT_STORE_ACCESS_KEY","secretKey":"$$OBJECT_STORE_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        CFG
        exec weed server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -volume.max=64 -master.volumeSizeLimitMB=1024
    ports:
      - "${SEAWEEDFS_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data

  # Creates the buckets services upload to. The S3 API does NOT create a bucket
  # on first write, and nothing else in the stack creates them -- recipes and
  # ocr-service both assume theirs exists. Before this, a fresh CLI stack left
  # the operator to create it by hand, and forgetting looked like an application
  # bug: the store is healthy, the API answers 200, and every photo import
  # fails.
  #
  # Runs the SAME image as the store (`weed shell` ships in it), so there is no
  # second image to keep alive -- the old MinIO setup needed `mc`, whose repo
  # vanished a day after the server's did.
  #
  # `s3.bucket.create` prints "already exists" and STILL EXITS 0, so it is safe
  # on every `up` -- but the exit code proves nothing either way, hence the
  # explicit s3.bucket.list check. Without it this goes green having created
  # nothing.
  seaweedfs-init:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: jarvis-seaweedfs-init
    depends_on:
      - seaweedfs
    env_file:
      - .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 >/dev/null 2>&1; do
          sleep 2
        done
        for b in $$(echo "$${OBJECT_STORE_BUCKETS:-jarvis-dev}" | tr ',' ' '); do
          echo "s3.bucket.create -name $$b" | weed shell -master=seaweedfs:9333
          echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 | grep -q "$$b" \
            || { echo "bucket $$b missing after create"; exit 1; }
          echo "bucket ready: $$b"
        done
    # It does its work and exits 0; unless-stopped would recreate it forever.
    restart: on-failure

  redis:
    image: redis:7
    container_name: jarvis-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --port ${REDIS_PORT}
    env_file:
      - .env
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: jarvis-redis-commander
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOSTS: local:redis:${REDIS_PORT}:0:${REDIS_PASSWORD}
    ports:
      - "${REDIS_COMMANDER_PORT}:8081"
    depends_on:
      - redis
    profiles:
      - tools

  go2rtc:
    image: alexxit/go2rtc
    container_name: jarvis-go2rtc
    restart: unless-stopped
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
    # Publish the WebRTC media port so STUN-discovered candidates are reachable
    # (required for WebRTC-only sources like the nest: battery doorbell).
    ports:
      - "8555:8555/tcp"
      - "8555:8555/udp"
    networks:
      - default
      - jarvis-net

  # MQTT broker for node communication. The ./jarvis CLI REGISTERS
  # jarvis-mqtt-broker at mqtt://localhost:1884 in config-service but never ran
  # one, so every MQTT path failed by timeout -- most visibly the mobile app
  # spinning on "Loading tools..." because GET /nodes/{id}/tools asks the node
  # over MQTT. install-e2e/quickstart asserts a mosquitto container exists
  # precisely because of that gap (found 2026-09-01).
  #
  # The startup script mirrors the installer's generator
  # (jarvis-installer/src/lib/compose-export-generator.ts) rather than inventing
  # a second shape. Two lines there are load-bearing:
  #   - `rm -f`, because `mosquitto_passwd -c` REFUSES an existing file on 2.1+,
  #     so without it a restart crash-loops.
  #   - `chown`, because mosquitto drops to the mosquitto user BEFORE reading the
  #     password file, and a root-owned 0600 pwfile crash-loops a fresh install.
  #
  # allow_anonymous defaults FALSE, closing the anonymous-broker window from
  # first boot: nodes fetch broker credentials over authenticated HTTP from
  # command-center, so there is no anonymous client to strand.
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: jarvis-mosquitto
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MQTT_USERNAME: "jarvis"
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_ALLOW_ANON: ${MQTT_ALLOW_ANON:-false}
    ports:
      - "${MQTT_PORT:-1884}:1883"
      - "${MQTT_WS_PORT:-9883}:9001"
    # `$$` is compose's escape: the container shell expands these, not compose.
    command:
      - sh
      - -c
      - |
        rm -f /tmp/pwfile
        mosquitto_passwd -b -c /tmp/pwfile "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
        chown mosquitto:mosquitto /tmp/pwfile
        echo 'listener 1883' > /tmp/mosquitto.conf
        echo 'protocol mqtt' >> /tmp/mosquitto.conf
        echo 'listener 9001' >> /tmp/mosquitto.conf
        echo 'protocol websockets' >> /tmp/mosquitto.conf
        echo "allow_anonymous $$MQTT_ALLOW_ANON" >> /tmp/mosquitto.conf
        echo 'password_file /tmp/pwfile' >> /tmp/mosquitto.conf
        exec mosquitto -c /tmp/mosquitto.conf -v
    volumes:
      - mosquitto_data:/mosquitto/data

networks:
  jarvis-net:
    external: true

volumes:
  mosquitto_data:
  postgres_data:
  seaweedfs_data:
  redis_data:
